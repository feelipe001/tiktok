
<style>

.hero::before {

    background-repeat: no-repeat;

}

/* Degradê da foto até o preto */
.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(
        to bottom,
        rgba(5, 5, 5, 0.08) 0%,
        rgba(5, 5, 5, 0.2) 25%,

}

.hero p {

}

.hero .hero-button {

    font-size: 15px;
    font-weight: 800;
    text-decoration: none;
    border-radius: 8px;
    transition: transform 0.2s ease;
}

.hero .hero-button:hover {
    transform: translateY(-2px);
}

@media (max-width: 600px) {
